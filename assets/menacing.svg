<svg xmlns="http://www.w3.org/2000/svg" width="720" height="120" viewBox="0 0 720 120">
  <style>
    .go {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", "Meiryo", sans-serif;
      font-weight: 900;
      fill: #BB9AF7;
      stroke: #7A3FD1;
      stroke-width: 1.5;
      paint-order: stroke;
      transform-box: fill-box;
      transform-origin: center;
      animation: menace 1.6s ease-in-out infinite;
    }
    .d1 { animation-delay: -0.2s; }
    .d2 { animation-delay: -0.5s; }
    .d3 { animation-delay: -0.8s; }
    .d4 { animation-delay: -1.1s; }
    .d5 { animation-delay: -1.4s; }
    @keyframes menace {
      0%, 100% { transform: translate(0, 0) scale(1) rotate(-6deg); opacity: 0.55; }
      50% { transform: translate(0, -6px) scale(1.12) rotate(4deg); opacity: 1; }
    }
    .quote {
      font-family: "Fira Code", "JetBrains Mono", Consolas, monospace;
      font-size: 22px;
      font-weight: 700;
      fill: #70A5FD;
      animation: glow 1.6s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
  </style>

  <!-- left side -->
  <text class="go" x="20" y="58" font-size="40">ゴ</text>
  <text class="go d2" x="62" y="96" font-size="30">ゴ</text>
  <text class="go d4" x="104" y="52" font-size="34">ゴ</text>
  <text class="go d1" x="138" y="100" font-size="24">ゴ</text>

  <!-- right side -->
  <text class="go d3" x="556" y="52" font-size="34">ゴ</text>
  <text class="go d5" x="596" y="98" font-size="26">ゴ</text>
  <text class="go d1" x="630" y="60" font-size="40">ゴ</text>
  <text class="go d2" x="678" y="96" font-size="24">ゴ</text>

  <text class="quote" x="360" y="68" text-anchor="middle">Is that a JoJo reference?</text>
</svg>
