.4h-2.9zM825.6 176.4h1.4v1.4h-1.4zM769.0 177.8h2.9v1.4h-2.9zM798.0 177.8h4.3v1.4h-4.3zM769.0 179.3h2.9v1.4h-2.9zM798.0 179.3h2.9v1.4h-2.9zM769.0 180.8h2.9v1.4h-2.9zM798.0 180.8h2.9v1.4h-2.9zM770.5 182.2h1.4v1.4h-1.4zM798.0 182.2h1.4v1.4h-1.4zM770.5 183.7h2.9v1.4h-2.9zM796.6 183.7h2.9v1.4h-2.9zM772.0 185.1h1.4v1.4h-1.4zM796.6 185.1h1.4v1.4h-1.4zM772.0 186.5h1.4v1.4h-1.4zM796.6 186.5h1.4v1.4h-1.4zM773.4 188.0h1.4v1.4h-1.4zM795.1 188.0h1.4v1.4h-1.4zM773.4 189.4h1.4v1.4h-1.4zM795.1 189.4h1.4v1.4h-1.4zM774.9 190.9h1.4v1.4h-1.4zM793.7 190.9h1.4v1.4h-1.4z"/><text x="17.0" y="62.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">We picked every part ourselves, saved up for 8 years, then built the</text><rect class="wipe" x="16.0" y="50.0" width="492.6" height="18.0" fill="#11111b" style="animation-delay:0.30s;animation-duration:0.88s"/><text x="17.0" y="81.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">whole thing by hand, piece by piece. The assembly took an afternoon.</text><rect class="wipe" x="16.0" y="69.0" width="492.6" height="18.0" fill="#11111b" style="animation-delay:0.88s;animation-duration:0.88s"/><text x="17.0" y="100.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">The waiting took most of my teens.</text><rect class="wipe" x="16.0" y="88.0" width="247.8" height="18.0" fill="#11111b" style="animation-delay:1.47s;animation-duration:0.44s"/><text x="17.0" y="138.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">Scratch is where I met programming. In middle school I started a</text><rect class="wipe" x="16.0" y="126.0" width="463.8" height="18.0" fill="#11111b" style="animation-delay:1.90s;animation-duration:0.83s"/><text x="17.0" y="157.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">coding club, and we shipped Asteroids in it — drag-and-drop blocks,</text><rect class="wipe" x="16.0" y="145.0" width="485.4" height="18.0" fill="#11111b" style="animation-delay:2.45s;animation-duration:0.87s"/><text x="17.0" y="176.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">collision maths worked out by hand, and a room full of people who</text><rect class="wipe" x="16.0" y="164.0" width="471.0" height="18.0" fill="#11111b" style="animation-delay:3.02s;animation-duration:0.84s"/><text x="17.0" y="195.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">had never written a line.</text><rect class="wipe" x="16.0" y="183.0" width="183.0" height="18.0" fill="#11111b" style="animation-delay:3.58s;animation-duration:0.33s"/><text x="17.0" y="233.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">Spider-Man is my guy. The Spider-Verse films are my favourite films,</text><rect class="wipe" x="16.0" y="221.0" width="492.6" height="18.0" fill="#11111b" style="animation-delay:3.93s;animation-duration:0.88s"/><text x="17.0" y="252.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">full stop — nothing else animates like that. And yes, I own more</text><rect class="wipe" x="16.0" y="240.0" width="463.8" height="18.0" fill="#11111b" style="animation-delay:4.52s;animation-duration:0.83s"/><text x="17.0" y="271.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">Spider-Man Lego sets than a third-year student should admit to.</text><rect class="wipe" x="16.0" y="259.0" width="456.6" height="18.0" fill="#11111b" style="animation-delay:5.07s;animation-duration:0.82s"/></svg>