<svg xmlns="http://www.w3.org/2000/svg" width="860" height="271" viewBox="0 0 860 271" role="img" aria-label="fun facts"><title>fun facts</title><rect x=".5" y=".5" width="859.0" height="270.0" rx="8" fill="#11111b" stroke="#1e1e2e"/><style>@keyframes wipe{from{transform:translateX(0)}to{transform:translateX(102%)}}.wipe{transform:translateX(102%);animation:wipe linear both}@media(prefers-reduced-motion:reduce){.wipe{animation:none}}</style><text x="17.0" y="29.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#89b4fa" xml:space="preserve">hamza@PC-HAMZA</text><text x="122.0" y="29.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#cdd6f4" xml:space="preserve">:</text><text x="129.5" y="29.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#f9e2af" xml:space="preserve">~</text><text x="137.0" y="29.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#a6e3a1" xml:space="preserve">$ </text><text x="152.0" y="29.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#cdd6f4" xml:space="preserve">cat fun-facts.txt</text><text x="17.0" y="60.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">We picked every part ourselves, saved up for 8 years, then built the</text><rect class="wipe" x="16.0" y="48.0" width="492.6" height="18.0" fill="#11111b" style="animation-delay:0.30s;animation-duration:0.88s"/><text x="17.0" y="79.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">whole thing by hand, piece by piece. The assembly took an afternoon.</text><rect class="wipe" x="16.0" y="67.0" width="492.6" height="18.0" fill="#11111b" style="animation-delay:0.88s;animation-duration:0.88s"/><text x="17.0" y="98.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">The waiting took most of my teens.</text><rect class="wipe" x="16.0" y="86.0" width="247.8" height="18.0" fill="#11111b" style="animation-delay:1.47s;animation-duration:0.44s"/><text x="17.0" y="136.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">My bootloader runs a Persona theme. I wrote the pack — 70+ of them.</text><rect class="wipe" x="16.0" y="124.0" width="485.4" height="18.0" fill="#11111b" style="animation-delay:1.90s;animation-duration:0.87s"/><text x="17.0" y="155.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">My gym sessions live in a git repo as versioned JSON, with e1RM maths</text><rect class="wipe" x="16.0" y="143.0" width="499.8" height="18.0" fill="#11111b" style="animation-delay:2.47s;animation-duration:0.90s"/><text x="17.0" y="174.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">and a rank scale. Yes, I review my own pull requests on leg day.</text><rect class="wipe" x="16.0" y="162.0" width="463.8" height="18.0" fill="#11111b" style="animation-delay:3.07s;animation-duration:0.83s"/><text x="17.0" y="212.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">To translate Persona 1 and 2 into French I had to take PSP EBOOT</text><rect class="wipe" x="16.0" y="200.0" width="463.8" height="18.0" fill="#11111b" style="animation-delay:3.75s;animation-duration:0.83s"/><text x="17.0" y="231.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">binaries apart, find the script tables and write the reinjector myself.</text><rect class="wipe" x="16.0" y="219.0" width="514.2" height="18.0" fill="#11111b" style="animation-delay:4.30s;animation-duration:0.92s"/><text x="17.0" y="250.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.0" font-weight="400" fill="#a6adc8" xml:space="preserve">Nobody had done it for these games in French before.</text><rect class="wipe" x="16.0" y="238.0" width="377.4" height="18.0" fill="#11111b" style="animation-delay:4.91s;animation-duration:0.68s"/></svg>