<svg xmlns="http://www.w3.org/2000/svg" width="860" height="184" viewBox="0 0 860 184" role="img" aria-label="whoami"><title>whoami</title><rect x=".5" y=".5" width="859.0" height="183.0" rx="8" fill="#11111b" stroke="#1e1e2e"/><style>@keyframes wipe{from{transform:translateX(0)}to{transform:translateX(102%)}}.wipe{transform:translateX(102%);animation:wipe linear both}@media(prefers-reduced-motion:reduce){.wipe{animation:none}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink 1.1s steps(1,end) infinite}</style><text x="17.0" y="29.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#89b4fa" xml:space="preserve">hamza@PC-HAMZA</text><text x="122.0" y="29.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#cdd6f4" xml:space="preserve">:</text><text x="129.5" y="29.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#f9e2af" xml:space="preserve">~</text><text x="137.0" y="29.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#a6e3a1" xml:space="preserve">$ </text><text x="152.0" y="29.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#cdd6f4" xml:space="preserve">whoami</text><text x="17.0" y="61.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#cdd6f4" xml:space="preserve">Third-year CS student (BUT Informatique), work-study, France.</text><rect class="wipe" x="16.0" y="48.5" width="460.5" height="18.5" fill="#11111b" style="animation-delay:0.35s;animation-duration:0.98s"/><text x="17.0" y="81.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#cdd6f4" xml:space="preserve">I build small complete things: a daily game, a gesture engine, a</text><rect class="wipe" x="16.0" y="68.5" width="483.0" height="18.5" fill="#11111b" style="animation-delay:1.05s;animation-duration:1.02s"/><text x="17.0" y="101.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#cdd6f4" xml:space="preserve">fighting game, and French fan translations of PSP-era Megaten titles.</text><rect class="wipe" x="16.0" y="88.5" width="520.5" height="18.5" fill="#11111b" style="animation-delay:1.79s;animation-duration:1.10s"/><text x="17.0" y="141.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#cdd6f4" xml:space="preserve">Everything ships with Docker, tests and a changelog. I don't leave</text><rect class="wipe" x="16.0" y="128.5" width="498.0" height="18.5" fill="#11111b" style="animation-delay:2.76s;animation-duration:1.06s"/><text x="17.0" y="161.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#cdd6f4" xml:space="preserve">projects half-finished — I just start too many of them.</text><rect class="wipe" x="16.0" y="148.5" width="415.5" height="18.5" fill="#11111b" style="animation-delay:3.53s;animation-duration:0.88s"/><rect class="cur" x="17.0" y="168.0" width="7.5" height="3" fill="#cdd6f4"/></svg>